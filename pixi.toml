[workspace]
name = "2026-bioit-workshop"
version = "0.1.0"
description = "Follow-along environment for BioIT World 2026 workshop materials"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64", "win-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
mkdocs = "*"
mkdocs-material = "*"
pytest = "*"
assay-helpers = { path = "examples/clean", editable = true }

[tasks]
open-messy-notebook = { cmd = "uvx marimo edit --sandbox --no-token examples/messy/screen_hit_qc.py", description = "Open a Part 3 messy Marimo notebook (uvx + sandbox)" }
serve-workshop-docs = { cmd = "mkdocs serve -f demos/doc-publishing/mkdocs.yaml", description = "Serve Part 1 doc publishing demo" }
test-clean-fallback = { cmd = "pytest", cwd = "examples/clean", description = "Run tests on Part 3 clean fallback" }
