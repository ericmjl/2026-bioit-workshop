[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bioit_workshop_demo"]

[project]
name = "bioit-workshop-demo"
version = "0.0.1"
description = "Representative pyds project init output for BioIT World 2026"
requires-python = ">=3.11"
dependencies = ["typer"]

[project.scripts]
bioit-workshop-demo = "bioit_workshop_demo.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64"]

[tool.pixi.pypi-dependencies]
bioit-workshop-demo = { path = ".", editable = true }

[tool.pixi.feature.tests.dependencies]
pytest = "*"

[tool.pixi.feature.docs.dependencies]
mkdocs = "*"
mkdocs-material = "*"

[tool.pixi.feature.tests.tasks]
test = "pytest"

[tool.pixi.feature.docs.tasks]
build-docs = "mkdocs build"
serve-docs = "mkdocs serve"

[tool.pixi.environments]
default = { features = ["tests"] }
docs = { features = ["docs"] }
